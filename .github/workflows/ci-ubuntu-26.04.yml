name: Ubuntu 26.04 CI

on: [push, pull_request]

jobs:
  Build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        mpi: [ 'mpich', 'openmpi', 'impi' ]
        # GFortran 16 on 26.04 is a pre-release snapshot; add 16 once a release is packaged
        gcc: [ 14, 15 ]
        # Open MPI only works with GFortran 14 and older (see
        # src/runtime-libraries/mpi/CMakeLists.txt)
        exclude:
          - { mpi: 'openmpi', gcc: 15 }

    env:
      FC: gfortran
      GCC_V: ${{ matrix.gcc }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt install -y "gfortran-${GCC_V}" "gcc-${GCC_V}" cmake
        sudo update-alternatives --install /usr/bin/gfortran gfortran "/usr/bin/gfortran-${GCC_V}" 100
        # Build C with the same GCC version as gfortran-${GCC_V} (26.04 defaults to GCC 15)
        echo "CC=gcc-${GCC_V}" >> "$GITHUB_ENV"

    - name: Setup MPI ${{ matrix.mpi }}
      if: matrix.mpi != 'mpich'
      uses: mpi4py/setup-mpi@v1
      with:
        mpi: ${{ matrix.mpi }}

    # Ubuntu's MPICH 4.3.2 (ch4:ucx) fails the sendget_convert tests
    - name: Setup MPI mpich (Homebrew)
      if: matrix.mpi == 'mpich'
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: |
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        brew install mpich
        # Only MPICH's own bin: Homebrew's gfortran must not shadow gfortran-${GCC_V}
        echo "$(brew --prefix mpich)/bin" >> "$GITHUB_PATH"

    # CTest 4.5.0 slows tests with heavy output into timeouts; revert this pin once the
    # images ship CMake 4.5.1 or later (https://gitlab.kitware.com/cmake/cmake/-/issues/28298)
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.4.5'

    - name: Build and Test
      run: |
        gfortran --version
        cmake --version
        ctest --version
        "${CC}" --version
        mpirun --version
        mkdir build
        (set -o pipefail; cmake -S . -B build -Wdev -DCMAKE_INSTALL_PREFIX:PATH="${HOME}/OpenCoarrays" -DCMAKE_BUILD_TYPE:STRING="Debug" | tee build/configure.log)
        # Fail unless configure named the job's MPI: tests depend on it (#814)
        case "${{ matrix.mpi }}" in
          openmpi) expected_mpi="Open MPI" ;;
          mpich) expected_mpi="MPICH" ;;
          impi) expected_mpi="Intel MPI" ;;
          *) echo "::error::No expected MPI name for matrix.mpi '${{ matrix.mpi }}'"; exit 1 ;;
        esac
        if ! grep -q -x -F -e "-- MPI implementation: ${expected_mpi}" build/configure.log; then
          echo "::error::Configure did not print '-- MPI implementation: ${expected_mpi}'"
          exit 1
        fi
        cmake --build build -j "$(nproc)"
        # Install to a prefix other than the configured one: nothing may go to the latter
        cmake --install build --prefix "${HOME}/prefix" || echo "installation failed"
        ctest --test-dir build --output-on-failure --schedule-random --repeat-until-fail 1 --timeout 200
        test -x "${HOME}/prefix/bin/caf"
        test -x "${HOME}/prefix/bin/cafrun"
        test ! -e "${HOME}/OpenCoarrays"
        cd build
        make uninstall
        # Fail on, and list, any file that make uninstall left
        if find "${HOME}/prefix" ! -type d | grep .; then exit 1; fi
        echo "Ran with mpi: ${{ matrix.mpi }}, gcc: ${{ matrix.gcc }}"
