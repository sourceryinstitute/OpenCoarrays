name: Windows CI

on: [push, pull_request]

jobs:
  Build:
    name: "Build (known failure #808)"
    runs-on: windows-latest
    # Tests hang under Intel MPI on Windows (#808); report without failing the PR
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}

    env:
      FC: gfortran
      CC: gcc
      # Ranks yield the CPU while waiting instead of busy-polling (#808)
      I_MPI_WAIT_MODE: 1

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Dependencies
      uses: msys2/setup-msys2@v2
      with:
        update: true
        path-type: inherit
        install: >-
          mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-gcc

    - name: setup-mpi
      id: setup-mpi
      uses: mpi4py/setup-mpi@v1
      with:
        mpi: intelmpi

    - name: MPI info
      run: |
        echo "${{ steps.setup-mpi.outputs.mpi }}"
        set -o verbose
        type mpiexec
        mpifc.bat -version || echo "ifort not installed"
        mpicc.bat -version || echo "icc not installed"
        set +o verbose

    - name: Build and Test
      run: |
        gfortran --version
        gcc --version
        mkdir build
        cmake -Wdev -G "Unix Makefiles" -S . -B build -DCMAKE_INSTALL_PREFIX="${HOME}/apps/OpenCoarrays" -DCMAKE_BUILD_TYPE:STRING="Debug"
        cmake --build build -j
        cmake --build build -t install -j || echo "installation failed"
        # Run tests one at a time in random order. After a failure, kill the
        # job's leftover processes: ctest kills only the launcher, and the
        # ranks it leaves exhaust shared memory for later tests (#808)
        mapfile -t tests < <(ctest --test-dir build -N | sed -n 's/^ *Test *#\([0-9]*\): /\1 /p' | shuf)
        failed=()
        for t in "${tests[@]}"; do
          # Longest passing test on Windows took 5.48 s
          if ! ctest --test-dir build --output-on-failure --timeout 35 -I "${t%% *},${t%% *}"; then
            failed+=("${t#* }")
            taskkill //F //T //IM mpiexec.exe //IM hydra_pmi_proxy.exe || true
          fi
        done
        echo "${#failed[@]} of ${#tests[@]} tests failed"
        printf '  %s\n' "${failed[@]}"
        [ "${#failed[@]}" -eq 0 ]
        echo "${HOME}/apps/OpenCoarrays/bin" >> $GITHUB_PATH
        export PATH="${HOME}/apps/OpenCoarrays/bin:${PATH}"
        which caf || true
        which cafrun || true
        cafrun --show || true
        caf --show || true
        cafrun --version || true
        caf --version || true
        cd build
        make uninstall

    - name: List leftover MPI processes
      if: always()
      run: |
        # Shows whether hung test jobs were cleaned up (#808)
        tasklist //FO CSV //NH > tasks.csv
        grep -i -E 'mpiexec|hydra' tasks.csv || echo "No mpiexec or hydra processes left"
        find build/bin -path '*-tests/*' -type f -printf '%f\n' | sed 's/\.exe$//' > test-programs.txt
        grep -i -F -f test-programs.txt tasks.csv || echo "No test programs left"

    - name: Warn that Windows tests are known to fail
      if: always()
      run: |
        msg="Tests hang under Intel MPI on Windows, so failures are allowed for now. A passing run does not mean Windows works. See https://github.com/sourceryinstitute/OpenCoarrays/issues/808"
        echo "::warning title=Windows tests are known to fail::${msg}"
        echo "> [!WARNING]" >> "${GITHUB_STEP_SUMMARY}"
        echo "> ${msg}" >> "${GITHUB_STEP_SUMMARY}"
